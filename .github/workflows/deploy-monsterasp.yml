name: Deploy to MonsterASP

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: monsterasp-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy production
    if: >-
      (github.event_name == 'workflow_dispatch' || vars.ENABLE_MONSTER_DEPLOY == 'true') &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: windows-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://budgetbasics-pk.runasp.net
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      PUBLISH_PASSWORD: ${{ secrets.MONSTER_PUBLISH_PASSWORD }}

    steps:
      - name: Check deployment secret
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PUBLISH_PASSWORD)) {
            throw 'The production environment secret MONSTER_PUBLISH_PASSWORD is not configured.'
          }

      - name: Check out verified main commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore BudgetBasics.slnx --locked-mode

      - name: Publish through Web Deploy
        shell: pwsh
        run: >-
          dotnet publish src/BudgetBasics.Web/BudgetBasics.Web.csproj
          --configuration Release
          --no-restore
          /p:PublishProfile=site95743-WebDeploy
          /p:Password="$env:PUBLISH_PASSWORD"

      - name: Verify production health
        shell: pwsh
        run: |
          $response = Invoke-WebRequest -Uri 'https://budgetbasics-pk.runasp.net/health' -UseBasicParsing -TimeoutSec 30
          if ($response.StatusCode -ne 200) {
            throw "Production health check returned HTTP $($response.StatusCode)."
          }
